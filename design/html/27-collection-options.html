<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF6EC; font-family: 'Outfit', system-ui, sans-serif; color: #141414">
  <div aria-hidden="true" style="height: 230px; background: #FF9FC4; border-bottom: 2.5px solid #141414; border-radius: 0 0 32px 32px; padding: 110px 20px 0 20px; box-sizing: border-box">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 800">Design</span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,20,20,0.5)"></div>
  <section aria-label="Collection options" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FDF6EC; border-top: 2.5px solid #141414; border-radius: 28px 28px 0 0; padding: 12px 18px 24px 16px; display: flex; flex-direction: column; gap: 8px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #141414; margin-bottom: 8px"></span>
    <div style="display: flex; align-items: center; gap: 12px; margin: 0 4px 8px 4px">
      <span style="width: 52px; height: 52px; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 16px; background: #FF9FC4; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg></span>
      <span style="display: flex; flex-direction: column"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">Design</h2><span style="font-size: 13px; font-weight: 600">24 links</span></span>
    </div>
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
      <button style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 12px; border: 0; border-radius: 16px; background: transparent; color: {{a.color}}; text-align: left">
        <span style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 12px; background: {{a.bg}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700">{{a.label}}</span><span style="font-size: 12px; font-weight: 500; color: #4A4A4A">{{a.sub}}</span></span>
      </button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const actions = [
      { label: 'Rename', sub: 'Change the collection’s name', bg: '#FFFFFF', color: '#141414', d: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      { label: 'Color & icon', sub: 'Make it easy to spot', bg: '#FFD23F', color: '#141414', d: 'M12 3a9 9 0 1 0 0 18c1 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.4-4-8-9-8zM7.5 11.5h.01M10.5 7.5h.01M15.5 7.5h.01' },
      { label: 'Pin to top', sub: 'Show first in Collections and on Home', bg: '#7CC4FF', color: '#141414', d: 'M12 17v5M5 17h14l-2-4V5H7v8z' },
      { label: 'Share all links', sub: 'Send the 24 links as a list', bg: '#7DDBA3', color: '#141414', d: 'M4 12v8h16v-8M16 6l-4-4-4 4M12 2v13' },
      { label: 'Delete collection', sub: 'Links move to “No collection”, nothing is lost', bg: '#FF6B5E', color: '#B42318', d: 'M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14' }
    ];
    return { actions };
  }
}
</script>
</body>
</html>
