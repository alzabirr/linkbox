<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home – AMOLED dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD23F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: 'Outfit', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 6px 20px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 600; color: #C8C8C8">Hey there!</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.8px; line-height: 1">Your links</h1>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Sort" style="width: 46px; height: 46px; border: 2.5px solid #FFFFFF; border-radius: 14px; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
      <button aria-label="Switch to list view" style="width: 46px; height: 46px; border: 2.5px solid #FFFFFF; border-radius: 14px; background: #FFD23F; color: #141414; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    </div>
  </header>
  <div style="padding: 12px 16px 0 16px">
    <label for="dark-search" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #141414; border: 2.5px solid #FFFFFF; border-radius: 18px; color: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="dark-search" placeholder="Search by name or link" style="flex: 1; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 16px; color: #FFFFFF">
    </label>
  </div>
  <nav aria-label="Collections" style="display: flex; gap: 8px; padding: 14px 16px 4px 16px; overflow: hidden">
    <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 2.5px solid #FFFFFF; background: #FFFFFF; color: #000000; font-size: 14px; font-weight: 700; white-space: nowrap">All</button>
    <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 2.5px solid #FF9FC4; background: #000000; color: #FF9FC4; font-size: 14px; font-weight: 600; white-space: nowrap">Design</button>
    <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 2.5px solid #7CC4FF; background: #000000; color: #7CC4FF; font-size: 14px; font-weight: 600; white-space: nowrap">Dev</button>
    <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 2.5px solid #FFD23F; background: #000000; color: #FFD23F; font-size: 14px; font-weight: 600; white-space: nowrap">Recipes</button>
    <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 2.5px solid #7DDBA3; background: #000000; color: #7DDBA3; font-size: 14px; font-weight: 600; white-space: nowrap">Read later</button>
  </nav>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 14px 16px 0 16px; flex: 1; overflow: hidden; align-content: start">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <article style="background: {{item.frame}}; border: 2.5px solid #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 7px; color: #141414">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase">{{item.collection}}</span>
          <span style="font-size: 11px; font-weight: 700; padding: 1px 7px; border: 2px solid #141414; border-radius: 8px; background: #FFFFFF">{{item.kind}}</span>
        </div>
        <div style="height: 92px; border: 2.5px solid #141414; border-radius: 14px; overflow: hidden; background: {{item.sky}}">
          <svg width="100%" height="92" viewBox="0 0 160 92" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="130" cy="24" r="11" fill="{{item.sun}}" stroke="#141414" stroke-width="2.5"/><path d="M-4 70 Q36 52 80 66 T164 60 V96 H-4Z" fill="{{item.ground}}" stroke="#141414" stroke-width="2.5"/></svg>
        </div>
        <h3 style="margin: 0; padding: 0 2px; font-size: 14px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px">{{item.title}}</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px 2px 2px">
          <span style="font-size: 11px; font-weight: 600">{{item.domain}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 800">{{item.no}}</span>
        </div>
      </article>
    </sc-for>
  </div>
  <button style="position: absolute; right: 16px; bottom: 102px; height: 58px; padding: 0 22px 0 16px; border: 2.5px solid #FFFFFF; border-radius: 20px; background: {{accent}}; color: #141414; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add link</button>
  <nav aria-label="Main" style="height: 84px; flex-shrink: 0; background: #000000; border-top: 2.5px solid #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <a href="DarkHome.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700">
      <span style="width: 60px; height: 32px; border-radius: 16px; background: #FFD23F; color: #141414; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg></span>Links</a>
    <a href="Collections.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #C8C8C8; font-size: 12px; font-weight: 600">
      <span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Collections</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #C8C8C8; font-size: 12px; font-weight: 600">
      <span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#FFD23F","#7DDBA3","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { title: 'Small kitchen layout ideas that actually work', domain: 'youtube.com', collection: 'Design', kind: 'Video', frame: '#FF9FC4', sky: '#7CC4FF', sun: '#FFD23F', ground: '#7DDBA3', no: 'NO.001' },
      { title: 'Material 3 theming in Flutter', domain: 'docs.flutter.dev', collection: 'Dev', kind: 'Article', frame: '#7CC4FF', sky: '#FFF1C7', sun: '#FF8A3D', ground: '#B79CFF', no: 'NO.002' },
      { title: 'Courtyard house plans – what would you change?', domain: 'reddit.com', collection: 'Design', kind: 'Post', frame: '#FFD23F', sky: '#B79CFF', sun: '#FFFFFF', ground: '#FF9F6B', no: 'NO.003' },
      { title: 'Chicken biryani, step by step', domain: 'youtube.com', collection: 'Recipes', kind: 'Video', frame: '#FF9F6B', sky: '#7DDBA3', sun: '#FFD23F', ground: '#FF9FC4', no: 'NO.004' }
    ];
    return { accent: this.props.accent ?? '#FF8A3D', items };
  }
}
</script>
</body>
</html>
