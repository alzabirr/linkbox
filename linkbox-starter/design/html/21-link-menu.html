<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link options menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF6EC; font-family: 'Outfit', system-ui, sans-serif; color: #141414">
  <div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 34px; width: 170px; border-radius: 10px; background: #EADFCB; margin-bottom: 10px"></div>
    <div style="height: 68px; border-radius: 18px; background: #FFFFFF; border: 2.5px solid #141414"></div>
    <div style="height: 68px; border-radius: 18px; background: #FFFFFF; border: 2.5px solid #141414"></div>
    <div style="height: 68px; border-radius: 18px; background: #FFFFFF; border: 2.5px solid #141414"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,20,20,0.5)"></div>
  <section aria-label="Link options" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FDF6EC; border-top: 2.5px solid #141414; border-radius: 28px 28px 0 0; padding: 12px 18px 24px 16px; display: flex; flex-direction: column; gap: 8px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #141414; margin-bottom: 6px"></span>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px; background: #FFD23F; border: 2.5px solid #141414; border-radius: 18px; margin-bottom: 6px">
      <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 13px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 6h10M7 12h10M7 18h6"/></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><strong style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Courtyard house plans – what would you…</strong><span style="font-size: 12px; font-weight: 600">reddit.com · Design</span></span>
    </div>
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="6">
      <button style="display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 12px; border: 0; border-radius: 16px; background: transparent; color: {{a.color}}; font-size: 16px; font-weight: 700; text-align: left">
        <span style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 12px; background: {{a.bg}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"/></svg></span>
        {{a.label}}
      </button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const actions = [
      { label: 'Open in browser', bg: '#7CC4FF', color: '#141414', d: 'M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6' },
      { label: 'Copy link', bg: '#FFFFFF', color: '#141414', d: 'M9 9h12v12H9zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1' },

      { label: 'Edit', bg: '#FFFFFF', color: '#141414', d: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      { label: 'Move to collection', bg: '#B79CFF', color: '#141414', d: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 13h6M12 10l3 3-3 3' },
      { label: 'Select more', bg: '#FFFFFF', color: '#141414', d: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11' },
      { label: 'Delete', bg: '#FF6B5E', color: '#B42318', d: 'M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14' }
    ];
    return { actions };
  }
}
</script>
</body>
</html>
