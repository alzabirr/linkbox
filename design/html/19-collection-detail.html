<x-dc>
<helmet>

<style>

  <header style="background: #FF9FC4; border-bottom: 2.5px solid #141414; border-radius: 0 0 32px 32px; padding: 18px 16px 22px 20px; position: relative; overflow: hidden">

    <div style="display: flex; justify-content: space-between; position: relative">
      <a href="Collections.dc.html" aria-label="Back to collections" style="width: 46px; height: 46px; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <button aria-label="Collection options" style="width: 46px; height: 46px; border: 2.5px solid #141414; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>

      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 800; letter-spacing: -1.4px; line-height: 1">Design</h1>
      <span style="font-size: 14px; font-weight: 600">24 links · updated today</span>
    </div>
  </header>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px 20px">
    <button style="height: 38px; padding: 0 12px 0 14px; border-radius: 19px; border: 2.5px solid #141414; background: #FFFFFF; color: #141414; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">Newest first<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>

  </div>
  <ul style="list-style: none; margin: 0; padding: 0 18px 0 16px; flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 8px; background: #FFFFFF; border: 2.5px solid #141414; border-radius: 18px; box-shadow: 3px 3px 0 #141414">
        <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; border: 2.5px solid #141414; background: {{item.frame}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#141414" stroke="#141414" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{item.glyph}}"/></svg></span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</span>
          <span style="font-size: 12px; font-weight: 500; color: #4A4A4A">{{item.domain}} · {{item.when}}</span>
        </div>
        <button aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; color: #141414; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </li>
    </sc-for>
  </ul>
  <a href="AddLink.dc.html" style="position: absolute; right: 18px; bottom: 26px; height: 58px; box-sizing: border-box; padding: 0 22px 0 16px; border: 2.5px solid #141414; border-radius: 20px; background: {{accent}}; color: #141414; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 4px 4px 0 #141414"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add to Design</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#FFD23F","#7DDBA3","#B79CFF"]},"$preview":{"width":390,"height":844}}'>

      { title: 'Staircase design for small houses', domain: 'youtube.com', when: 'last week', glyph: play, frame: '#B79CFF' },
      { title: 'Ventilation tips for hot climates', domain: 'medium.com', when: 'last week', glyph: doc, frame: '#FF9F6B' },

}
</script>
</body>
</html>
