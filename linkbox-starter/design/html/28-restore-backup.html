<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restore from backup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF6EC; font-family: 'Outfit', system-ui, sans-serif; color: #141414; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 10px 16px">
    <a href="Backup.dc.html" aria-label="Back" style="width: 46px; height: 46px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Restore</h1>
  </header>
  <div style="padding: 4px 18px 0 16px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0 2px; font-size: 15px; line-height: 1.45; font-weight: 500">Pick a backup from <strong style="font-weight: 800">Download/Linkbox</strong>.</p>
    <div role="radiogroup" aria-label="Backups" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{backups}}" as="b" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{b.checked}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 2.5px solid #141414; border-radius: 18px; background: {{b.bg}}; box-shadow: {{b.shadow}}; text-align: left; color: #141414">
          <span style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">{{b.date}}</span><span style="font-size: 12px; font-weight: 600">{{b.meta}}</span></span>
          <span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2.5px solid #141414; background: {{b.dot}}"></span>
        </button>
      </sc-for>
    </div>
    <h2 style="margin: 8px 2px 0 2px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">How should we restore?</h2>
    <div role="radiogroup" aria-label="Restore mode" style="display: flex; flex-direction: column; gap: 10px">
      <button role="radio" aria-checked="true" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2.5px solid #141414; border-radius: 18px; background: #7DDBA3; text-align: left; color: #141414">
        <span style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; border: 2.5px solid #141414; background: #141414; box-shadow: inset 0 0 0 4px #FFFFFF"></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Add to my links</span><span style="font-size: 13px; font-weight: 500">Keeps everything you have now. Duplicates are skipped.</span></span>
      </button>
      <button role="radio" aria-checked="false" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 2.5px solid #141414; border-radius: 18px; background: #FFFFFF; text-align: left; color: #141414">
        <span style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; border: 2.5px solid #141414; background: #FFFFFF"></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">Replace everything</span><span style="font-size: 13px; font-weight: 500">Your current 89 links are removed first.</span></span>
      </button>
    </div>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 18px 24px 16px">
    <button style="width: 100%; height: 60px; border: 2.5px solid #141414; border-radius: 20px; background: {{accent}}; box-shadow: 4px 4px 0 #141414; color: #141414; font-size: 17px; font-weight: 800">Restore 142 links</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#FFD23F","#7DDBA3","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (date, meta, on) => ({ date, meta, checked: on ? 'true' : 'false', bg: on ? '#FFD23F' : '#FFFFFF', shadow: on ? '3px 3px 0 #141414' : 'none', dot: on ? '#141414' : '#FFFFFF' });
    const backups = [
      mk('28 Oct 2026, 9:14 PM', '142 links · 5 collections · 48 KB', true),
      mk('14 Oct 2026, 8:02 PM', '120 links · 4 collections · 41 KB', false),
      mk('1 Oct 2026, 10:30 AM', '97 links · 4 collections · 33 KB', false)
    ];
    return { accent: this.props.accent ?? '#FF8A3D', backups };
  }
}
</script>
</body>
</html>
