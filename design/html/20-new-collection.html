<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New collection sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF6EC; font-family: 'Outfit', system-ui, sans-serif; color: #141414">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,20,20,0.5)"></div>
  <section aria-label="New collection" style="position: absolute; left: 0; right: 0; bottom: 0; top: 110px; background: #FDF6EC; border-top: 2.5px solid #141414; border-radius: 28px 28px 0 0; padding: 12px 20px 24px 18px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #141414"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">New collection</h2>
      <a href="Collections.dc.html" aria-label="Close" style="width: 46px; height: 46px; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    </div>
    <div style="display: flex; gap: 14px; align-items: center; padding: 14px; background: {{color}}; border: 2.5px solid #141414; border-radius: 22px; box-shadow: 4px 4px 0 #141414">
      <span style="width: 56px; height: 56px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-8-8 14-2-6z"/><path d="M12 16l10-8"/></svg></span>
      <span style="display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">Travel</span><span style="font-size: 13px; font-weight: 600">0 links · preview</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between"><label for="cn" style="font-size: 14px; font-weight: 700">Name</label><span style="font-size: 12px; font-weight: 600; color: #4A4A4A">6 / 30</span></div>
      <input id="cn" value="Travel" style="height: 56px; padding: 0 14px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #141414; border-radius: 16px; box-shadow: 3px 3px 0 #141414; outline: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #141414">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 700">Color</span>
      <div role="radiogroup" aria-label="Collection color" style="display: flex; gap: 10px">
        <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" style="width: 46px; height: 46px; border-radius: 23px; border: 2.5px solid #141414; background: {{s.hex}}; box-shadow: {{s.ring}}"></button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 700">Icon</span>
      <div role="radiogroup" aria-label="Collection icon" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{icons}}" as="i" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{i.checked}}" aria-label="{{i.name}}" style="height: 48px; border: 2.5px solid #141414; border-radius: 14px; background: {{i.bg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></button>
        </sc-for>
      </div>
    </div>
    <div style="flex: 1"></div>
    <button style="height: 60px; border: 2.5px solid #141414; border-radius: 20px; background: {{accent}}; box-shadow: 4px 4px 0 #141414; color: #141414; font-size: 17px; font-weight: 800">Create collection</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#FFD23F","#7DDBA3","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = '#7CC4FF';
    const sw = [['Pink','#FF9FC4'],['Blue','#7CC4FF'],['Yellow','#FFD23F'],['Green','#7DDBA3'],['Purple','#B79CFF'],['Peach','#FF9F6B']];
    const swatches = sw.map(([name, hex]) => ({ name, hex, checked: hex === sel ? 'true' : 'false', ring: hex === sel ? '0 0 0 3px #FDF6EC, 0 0 0 5.5px #141414' : 'none' }));
    const ic = [
      ['Plane', 'M2 16l20-8-8 14-2-6zM12 16l10-8', true],
      ['Star', 'M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z', false],
      ['Code', 'M8 7l-5 5 5 5M16 7l5 5-5 5', false],
      ['Book', 'M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z', false],
      ['Home', 'M3 11l9-7 9 7v9H3zM9 20v-6h6v6', false],
      ['Music', 'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z', false]
    ];
    const icons = ic.map(([name, d, on]) => ({ name, d, checked: on ? 'true' : 'false', bg: on ? '#FFD23F' : '#FFFFFF' }));
    return { accent: this.props.accent ?? '#FF8A3D', color: sel, swatches, icons };
  }
}
</script>
</body>
</html>
