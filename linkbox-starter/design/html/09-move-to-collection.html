<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move to collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF6EC; font-family: 'Outfit', system-ui, sans-serif; color: #141414">
  <div aria-hidden="true" style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 34px; width: 170px; border-radius: 10px; background: #EADFCB"></div>
    <div style="height: 64px; border-radius: 18px; background: #FFFFFF; border: 2.5px solid #141414"></div>
    <div style="height: 64px; border-radius: 18px; background: #FFFFFF; border: 2.5px solid #141414"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,20,20,0.5)"></div>
  <section aria-label="Move 3 links" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FDF6EC; border-top: 2.5px solid #141414; border-radius: 28px 28px 0 0; padding: 12px 18px 24px 16px; display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #141414; margin-bottom: 6px"></span>
    <h2 style="margin: 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Move 3 links to…</h2>
    <p style="margin: 0 4px 6px 4px; font-size: 14px; font-weight: 500; color: #3A3A3A">Pick a collection. Links can only be in one.</p>
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <button style="display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 14px 0 8px; border: 2.5px solid #141414; border-radius: 18px; background: {{c.bg}}; box-shadow: {{c.shadow}}; color: #141414; text-align: left">
        <span style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid #141414; border-radius: 12px; background: {{c.color}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; font-weight: 500; color: #3A3A3A">{{c.count}}</span></span>
        <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><span style="width: 28px; height: 28px; border-radius: 14px; background: #141414; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
      </button>
    </sc-for>
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border: 2.5px dashed #141414; border-radius: 18px; background: transparent; color: #141414; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New collection</button>
    <button style="margin-top: 6px; height: 58px; border: 2.5px solid #141414; border-radius: 20px; background: {{accent}}; box-shadow: 4px 4px 0 #141414; color: #141414; font-size: 16px; font-weight: 800">Move to Design</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#FFD23F","#7DDBA3","#B79CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, count, color, on) => ({ name, count, color, on, bg: on ? '#FFD23F' : '#FFFFFF', shadow: on ? '3px 3px 0 #141414' : 'none' });
    const cols = [
      mk('No collection', '8 links', '#FFFFFF', false),
      mk('Design', '24 links', '#FF9FC4', true),
      mk('Dev', '17 links', '#7CC4FF', false),
      mk('Recipes', '9 links', '#FFD23F', false),
      mk('Read later', '31 links', '#7DDBA3', false)
    ];
    return { accent: this.props.accent ?? '#FF8A3D', cols };
  }
}
</script>
</body>
</html>
